[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vibernt-cupel"
version = "0.1.0"
description = "Know which tests protect you: the pytest collector for Cupel."
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = []
classifiers = [
  # PyPI rejects uploads carrying this classifier. Remove only with the owner's approval (L6).
  "Private :: Do Not Upload",
]

[tool.setuptools.packages.find]
where = ["src"]
