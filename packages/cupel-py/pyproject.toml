[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vibernt-cupel"
version = "0.0.0"
description = "Keep only the tests worth running: the pytest collector for Cupel."
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []
classifiers = [
  # PyPI rejects uploads carrying this classifier. Remove only with the owner's approval (L6).
  "Private :: Do Not Upload",
]

[tool.setuptools.packages.find]
where = ["src"]
